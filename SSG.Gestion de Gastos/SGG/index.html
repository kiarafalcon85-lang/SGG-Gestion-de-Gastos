<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Iniciar Sesión 🍓</title>
    <style>
        :root {
            --bg-page: #fff0f3;
            --bg-card: #ffffff;
            --pink-accent: #ff85a1;
            --pink-soft: #fbb1bd;
            --text-dark: #5c3d46;
            --text-muted: #8d6e75;
            --border-color: #f7cad0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(255, 133, 161, 0.15);
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-page);
            color: var(--text-dark);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background: var(--pink-accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background: #ff6b8b;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon">🍓</div>
        <h1>Budget Tracker</h1>
        <p>Bienvenido/a al Sistema de Gastos 🎀</p>

        <!-- Redirige al dashboard ya con el nombre corregido -->
        <form action="./dashboard.html">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" placeholder="Tu usuario..." required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Ingresar ✨</button>
        </form>
    </div>

</body>
</html>
