<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Dashboard Aesthetic 🍓</title>
    <style>
        :root {
            --bg-page: #fff0f3;
            --bg-card: #ffffff;
            --pink-accent: #ff85a1;
            --pink-soft: #fbb1bd;
            --text-dark: #5c3d46;
            --text-muted: #8d6e75;
            --border-color: #f7cad0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-dark);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(255, 133, 161, 0.15);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h1 {
            font-size: 26px;
            color: var(--text-dark);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .btn-logout {
            background: var(--pink-soft);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            font-size: 13px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--bg-page);
            padding: 18px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .card h3 {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .card .amount {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-dark);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .box {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
        }

        .box h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--text-dark);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-page);
            color: var(--text-dark);
            outline: none;
        }

        .btn-add {
            width: 100%;
            background: var(--pink-accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--bg-page);
            font-size: 13px;
        }

        th {
            color: var(--text-muted);
        }

        .btn-delete {
            background: #ffb4a2;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-title">
                <span style="font-size: 32px;">🍓</span>
                <div>
                    <h1>Budget Tracker</h1>
                    <p class="subtitle">Take control of your money & reach your goals 🎀</p>
                </div>
            </div>
            <a href="./index.html" class="btn-logout">Cerrar Sesión</a>
        </div>

        <div class="cards-grid">
            <div class="card">
                <h3>Total Ingresos 👛</h3>
                <div class="amount" id="total-ingresos">$0.00</div>
            </div>
            <div class="card">
                <h3>Total Gastos 🛍️</h3>
                <div class="amount" id="total-gastos">$0.00</div>
            </div>
            <div class="card">
                <h3>Balance Disponible 🎀</h3>
                <div class="amount" id="total-balance">$0.00</div>
            </div>
        </div>

        <div class="main-grid">
            <div class="box">
                <h2>Cargar Nuevo Gasto ✨</h2>
                <form id="form-gasto">
                    <div class="form-group">
                        <label>Descripción</label>
                        <input type="text" id="gasto-descripcion" placeholder="Ej. Insumos..." required>
                    </div>
                    <div class="form-group">
                        <label>Monto ($)</label>
                        <input type="number" id="gasto-monto" min="0.01" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="gasto-categoria" required>
                            <option value="Comida">Comida 🍰</option>
                            <option value="Estudios">Estudios 📚</option>
                            <option value="Transporte">Transporte 🚌</option>
                            <option value="Varios">Otros 🎀</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" id="gasto-fecha" required>
                    </div>
                    <button type="submit" class="btn-add">Registrar Gasto 💗</button>
                </form>
            </div>

            <div class="box">
                <h2>Historial de Gastos 📋</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Concepto</th>
                            <th>Cat.</th>
                            <th>Monto</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-gastos-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="./gastos.js"></script>
</body>
</html>
