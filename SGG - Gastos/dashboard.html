<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SGG - Sistema de Gestión de Gastos y Presupuesto Personal">
    <title>SGG - Budget Tracker 🍓</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-mode">

    <header class="top-bar">
        <h1>🍓 SGG - Budget Tracker</h1>
        <div class="header-btns">
            <button id="theme-toggle" class="btn-theme" aria-label="Cambiar Tema">🌙 Modo Oscuro</button>
            <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
        </div>
    </header>

    <main class="main-container">
        
        <!-- PANEL DE RESUMEN (RF-09) -->
        <section class="summary-card">
            <h2>Total Gastado 🍓</h2>
            <div class="total-monto" id="total-monto">$0.00</div>
        </section>

        <!-- FORMULARIO DE CARGA / EDICIÓN (RF-05 / RF-07) -->
        <section class="crud-section">
            <h2 id="form-title">Registrar Nuevo Gasto 🌸</h2>
            <form id="form-gastos" class="gastos-form-grid">
                <input type="hidden" id="gasto-id">

                <div class="input-group">
                    <label for="gasto-monto">Monto ($)</label>
                    <input type="number" id="gasto-monto" min="0.01" step="0.01" required placeholder="0.00">
                </div>

                <div class="input-group">
                    <label for="gasto-fecha">Fecha</label>
                    <input type="date" id="gasto-fecha" required>
                </div>

                <div class="input-group">
                    <label for="gasto-categoria">Categoría</label>
                    <select id="gasto-categoria" required>
                        <option value="" disabled selected>Seleccionar...</option>
                        <option value="Alimentación">Alimentación 🍓</option>
                        <option value="Transporte">Transporte 🚌</option>
                        <option value="Servicios">Servicios 💡</option>
                        <option value="Ocio">Ocio 🎀</option>
                    </select>
                </div>

                <div class="input-group full-width">
                    <label for="gasto-descripcion">Descripción</label>
                    <input type="text" id="gasto-descripcion" required placeholder="Ej. Compras del super, Cine...">
                </div>

                <div class="form-actions full-width">
                    <button type="submit" id="btn-guardar" class="btn-primary">Guardar Gasto 🍓</button>
                    <button type="button" id="btn-cancelar" class="btn-secondary hidden">Cancelar Edición</button>
                </div>
            </form>
        </section>

        <!-- HISTORIAL DINÁMICO DE GASTOS (RF-06 / RF-08) -->
        <section class="crud-section">
            <h2>Historial de Gastos 📋</h2>
            <table class="tabla-gastos">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Categoría</th>
                        <th>Descripción</th>
                        <th>Monto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-gastos">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </section>

    </main>

    <script src="js/gastos.js"></script>
</body>
</html>
