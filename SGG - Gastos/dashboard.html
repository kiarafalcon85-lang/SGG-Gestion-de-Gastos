<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Panel de Gastos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-mode">

    <!-- Verificación de sesión antes de cargar el contenido -->
    <script>
        if (!sessionStorage.getItem("usuarioAutenticado")) {
            window.location.href = "index.html";
        }
    </script>

    <header class="top-bar">
        <h1>SGG - Sistema de Gestión de Gastos</h1>
        <div class="user-controls">
            <button id="theme-toggle" class="btn-theme">🌙 Modo Oscuro</button>
            <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
        </div>
    </header>

    <main class="main-container">
        <section class="welcome-section">
            <h2>Bienvenido, <span id="user-display-name">Profesor</span></h2>
            <p>Aquí puedes gestionar y revisar tus registros de gastos.</p>
        </section>

        <!-- Formulario y Tabla de Gastos -->
        <section class="crud-section">
            <h3>Registro de Gastos</h3>
            <form id="form-gastos" class="gastos-form">
                <input type="text" id="gasto-concepto" placeholder="Concepto (ej. Alquiler, Comida)" required>
                <input type="number" id="gasto-monto" placeholder="Monto ($)" min="1" step="0.01" required>
                <button type="submit" class="btn-primary">Añadir Gasto</button>
            </form>

            <table class="tabla-gastos">
                <thead>
                    <tr>
                        <th>Concepto</th>
                        <th>Monto</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="lista-gastos">
                    <!-- Los datos se cargan dinámicamente -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="js/gastos.js"></script>
</body>
</html>
