<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestión de Gastos - Inicio de Sesión">
    <title>SGG - Iniciar Sesión 🍓</title>
    <style>
        :root {
            --bg-page: #fff0f3;
            --bg-card: #ffffff;
            --pink-accent: #d63384; /* Rosa con alto contraste para WCAG AAA */
            --pink-hover: #b02a6f;
            --text-dark: #2b1810;  /* Texto más oscuro para fácil lectura */
            --text-muted: #594047; /* Contraste corregido para accesibilidad */
            --border-color: #f7cad0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        main.login-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.15);
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-dark);
            margin-bottom: 6px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: #ffffff;
            color: var(--text-dark);
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: var(--pink-accent);
        }

        .btn-submit {
            width: 100%;
            background: var(--pink-accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: var(--pink-hover);
        }
    </style>
</head>
<body>

    <main class="login-card">
        <div class="icon" aria-hidden="true">🍓</div>
        <h1>Budget Tracker</h1>
        <p>Bienvenido/a al Sistema de Gastos 🎀</p>

        <form action="./dashboard.html" method="GET">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Tu usuario..." required aria-required="true">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required aria-required="true">
            </div>
            <button type="submit" class="btn-submit">Ingresar ✨</button>
        </form>
    </main>

</body>
</html>
